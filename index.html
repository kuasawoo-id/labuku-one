<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5F6F8">
  <meta name="description" content="LABUKU One — Buku Kinerja ASN KUA · by Ahzani Labs">
  <title>LABUKU One</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <!-- Layar masuk / setup (render oleh JS) -->
  <div id="screen-auth" class="screen">
    <div class="splash"><div class="logo">L1</div></div>
  </div>

  <!-- Aplikasi utama -->
  <div id="screen-app" class="screen" hidden>
    <aside id="nav-side" aria-label="Navigasi utama"></aside>
    <div id="main">
      <header id="appbar" class="appbar">
        <button id="btnBack" class="icon-btn" data-act="back" aria-label="Kembali" hidden><i class="bi bi-chevron-left"></i></button>
        <h1 id="pageTitle">Beranda</h1>
        <div id="appbarActions" class="appbar-actions"></div>
      </header>
      <main id="view"></main>
    </div>
    <nav id="nav-bottom" aria-label="Navigasi bawah"></nav>
  </div>

  <div id="toasts" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
